// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {

function TweakRow({ label, value, children, inline = false }) {

      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (

      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

            height: 44, padding: '0 14px', border: 'none', background: 'none', cursor: 'pointer',
            fontFamily: 'inherit', fontSize: 13, fontWeight: page === item.id ? 600 : 400,
            color: page === item.id ? c.text : c.textSub,
            borderBottom: page === item.id ? `2px solid ${c.primary}` : '2px solid transparent',
            transition: 'all 0.15s',
          }}>
            {item.label}
          </button>
        ))}
        <div style={{ flex: 1 }} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: c.card, border: `1px solid ${c.border}`, borderRadius: 6, padding: '5px 10px', fontSize: 12, color: c.textSub, cursor: 'pointer' }}>
          <span style={{ fontFamily: "'DM Mono', monospace", fontSize: 11 }}>⌘K</span>
          <span>Schnellsuche</span>
        </div>
        <div style={{ width: 1, background: c.border, height: 24, margin: '0 12px' }} />
        <button style={{ padding: '5px 12px', background: c.primary, color: '#fff', border: 'none', borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>
          + {page === 'kunden' ? 'Kunde' : page === 'projekte' ? 'Projekt' : 'Neu'}
        </button>
        <div style={{ width: 28, height: 28, borderRadius: '50%', background: '#2d3d6b', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, fontWeight: 700, color: '#8fa0c4', marginLeft: 10, cursor: 'pointer' }}>AM</div>
      </div>

      {/* Page content */}
      <div style={{ flex: 1, overflow: 'auto' }}>
        {page === 'dashboard' && <D3Dashboard c={c} setPage={setPage} />}
        {page === 'kunden' && <D3Customers c={c} />}
        {page === 'projekte' && <D3Projects c={c} />}
        {page === 'einstellungen' && <div style={{ padding: 24, color: c.textSub, fontSize: 13 }}>Einstellungen…</div>}
      </div>
    </div>
  );
}

function D3StatusBadge({ s, c }) {
  const cfg = { 'In Arbeit': [c.primary, '#0d2340'], 'Entwurf': [c.textSub, '#1c2333'], 'Abgeschlossen': [c.green, '#0d2020'], 'Verrechnet': [c.accent, '#0a2020'], 'Pausiert': [c.warning, '#2a1e00'], 'Storniert': [c.danger, '#2a0d10'], 'Offen': [c.primary, '#0d2340'] };
  const [col, bg] = cfg[s] || [c.textSub, c.card];
  return <span style={{ fontSize: 10, fontWeight: 600, padding: '2px 8px', borderRadius: 4, background: bg, color: col, letterSpacing: '0.2px', border: `1px solid ${col}30` }}>{s}</span>;
}

function D3Dashboard({ c, setPage }) {
  const metrics = [
    { label: 'KUNDEN', val: '24', sub: '+2 diese Woche', col: c.primary },
    { label: 'PROJEKTE AKTIV', val: '8', sub: '3 mit Risiko', col: c.accent },
    { label: 'BUDGET GESAMT', val: '€155k', sub: '64% genutzt', col: c.warning },
    { label: 'ABGESCHLOSSEN', val: '31', sub: '5 diesen Monat', col: c.green },
  ];
  return (
    <div style={{ padding: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>
      {/* Metric row */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 10 }}>
        {metrics.map(m => (
          <div key={m.label} style={{ background: c.card, border: `1px solid ${c.border}`, borderRadius: 8, padding: '14px 16px', borderTop: `2px solid ${m.col}` }}>
            <div style={{ fontSize: 9, fontWeight: 700, color: c.textDim, letterSpacing: '1px', marginBottom: 8 }}>{m.label}</div>
            <div style={{ fontSize: 26, fontWeight: 700, color: c.text, fontFamily: "'DM Sans', sans-serif", letterSpacing: '-0.5px' }}>{m.val}</div>
            <div style={{ fontSize: 10, color: c.textSub, marginTop: 4 }}>{m.sub}</div>
          </div>
        ))}
      </div>

      {/* Tables */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
        {/* Customers */}
        <div style={{ background: c.card, border: `1px solid ${c.border}`, borderRadius: 8 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 14px', borderBottom: `1px solid ${c.border}` }}>
            <span style={{ fontSize: 11, fontWeight: 600, color: c.text }}>Kunden</span>
            <button onClick={() => setPage('kunden')} style={{ fontSize: 10, color: c.primary, background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'inherit' }}>Alle →</button>
          </div>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11 }}>
            <thead>
              <tr style={{ borderBottom: `1px solid ${c.border}` }}>
                {['Kd.-Nr.', 'Name', 'Stadt', ''].map(h => <th key={h} style={{ padding: '6px 14px', textAlign: 'left', color: c.textDim, fontWeight: 600, fontSize: 10, letterSpacing: '0.5px' }}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {CUSTOMERS.slice(0, 5).map(cu => (
                <tr key={cu.id} style={{ borderBottom: `1px solid ${c.border}20` }}>
                  <td style={{ padding: '7px 14px', fontFamily: "'DM Mono', monospace", color: c.textSub, fontSize: 10 }}>{cu.no}</td>
                  <td style={{ padding: '7px 14px', color: c.text, fontWeight: 500 }}>{cu.name}</td>
                  <td style={{ padding: '7px 14px', color: c.textSub }}>{cu.city}</td>
                  <td style={{ padding: '7px 14px' }}>
                    <span style={{ width: 6, height: 6, borderRadius: '50%', background: cu.status ? c.green : c.textDim, display: 'inline-block' }} />
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        {/* Projects */}
        <div style={{ background: c.card, border: `1px solid ${c.border}`, borderRadius: 8 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 14px', borderBottom: `1px solid ${c.border}` }}>
            <span style={{ fontSize: 11, fontWeight: 600, color: c.text }}>Projekte</span>
            <button onClick={() => setPage('projekte')} style={{ fontSize: 10, color: c.primary, background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'inherit' }}>Alle →</button>
          </div>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 11 }}>
            <thead>
              <tr style={{ borderBottom: `1px solid ${c.border}` }}>
                {['Proj.-Nr.', 'Name', 'Budget %', 'Status'].map(h => <th key={h} style={{ padding: '6px 14px', textAlign: 'left', color: c.textDim, fontWeight: 600, fontSize: 10, letterSpacing: '0.5px' }}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {PROJECTS.slice(0, 5).map(pr => (
                <tr key={pr.id} style={{ borderBottom: `1px solid ${c.border}20` }}>
                  <td style={{ padding: '7px 14px', fontFamily: "'DM Mono', monospace", color: c.textSub, fontSize: 10 }}>{pr.no}</td>
                  <td style={{ padding: '7px 14px', color: c.text, fontWeight: 500, maxWidth: 140, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{pr.name}</td>
                  <td style={{ padding: '7px 14px', minWidth: 90 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <div style={{ flex: 1, background: c.surface, borderRadius: 3, height: 3, overflow: 'hidden' }}>
                        <div style={{ height: '100%', width: `${pr.used}%`, background: pr.used > 90 ? c.danger : c.primary, borderRadius: 3 }} />
                      </div>
                      <span style={{ fontSize: 9, color: c.textSub, fontFamily: "'DM Mono', monospace", flexShrink: 0 }}>{pr.used}%</span>
                    </div>
                  </td>
                  <td style={{ padding: '7px 14px' }}><D3StatusBadge s={pr.status} c={c} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function D3Customers({ c }) {
  const [search, setSearch] = React.useState('');
  const filtered = CUSTOMERS.filter(cu => cu.name.toLowerCase().includes(search.toLowerCase()) || cu.no.includes(search));
  return (
    <div style={{ padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
      {/* Filter bar */}
      <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, background: c.card, border: `1px solid ${c.border}`, borderRadius: 6, padding: '5px 10px', flex: 1 }}>
          <span style={{ color: c.textSub, fontSize: 12 }}>⌕</span>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Suchen..." style={{ border: 'none', outline: 'none', flex: 1, background: 'transparent', color: c.text, fontSize: 12, fontFamily: 'inherit' }} />
        </div>
        {['Alle Typen', 'Aktiv', '25 / Seite'].map(opt => (
          <select key={opt} defaultValue={opt} style={{ padding: '5px 10px', background: c.card, border: `1px solid ${c.border}`, borderRadius: 6, fontSize: 11, color: c.textSub, fontFamily: 'inherit', outline: 'none', cursor: 'pointer' }}>
            <option>{opt}</option>
          </select>
        ))}
        <span style={{ fontSize: 11, color: c.textDim, marginLeft: 4 }}>{filtered.length} Einträge</span>
      </div>

      {/* Table */}
      <div style={{ background: c.card, border: `1px solid ${c.border}`, borderRadius: 8, overflow: 'hidden' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
          <thead>
            <tr style={{ background: c.surface, borderBottom: `1px solid ${c.border}` }}>
              {['Kd.-Nr.', 'Name / Unternehmen', 'Typ', 'Ort', 'E-Mail', 'UID-Nr.', 'Projekte', 'Status', ''].map(h => (
                <th key={h} style={{ padding: '8px 12px', textAlign: 'left', fontSize: 10, fontWeight: 600, color: c.textDim, letterSpacing: '0.6px', textTransform: 'uppercase', whiteSpace: 'nowrap' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map((cu, i) => (
              <tr key={cu.id} style={{ borderBottom: `1px solid ${c.border}30`, background: i % 2 === 0 ? 'transparent' : c.surface + '40' }}>
                <td style={{ padding: '8px 12px', fontFamily: "'DM Mono', monospace", fontSize: 10, color: c.textSub }}>{cu.no}</td>
                <td style={{ padding: '8px 12px' }}>
                  <span style={{ fontWeight: 600, color: c.text }}>{cu.name}</span>
                  {cu.contact && <span style={{ display: 'block', fontSize: 10, color: c.textSub }}>{cu.contact}</span>}
                </td>
                <td style={{ padding: '8px 12px' }}><span style={{ fontSize: 10, padding: '1px 6px', borderRadius: 3, border: `1px solid ${c.border}`, color: c.textSub }}>{cu.type}</span></td>
                <td style={{ padding: '8px 12px', color: c.textSub, fontSize: 11 }}>{cu.city}</td>
                <td style={{ padding: '8px 12px', color: c.primary, fontSize: 11 }}>{cu.email}</td>
                <td style={{ padding: '8px 12px', fontFamily: "'DM Mono', monospace", fontSize: 10, color: c.textSub }}>{cu.vat || '—'}</td>
                <td style={{ padding: '8px 12px' }}>
                  <span style={{ fontSize: 10, color: cu.active > 0 ? c.primary : c.textSub, fontFamily: "'DM Mono', monospace" }}>{cu.active}/{cu.projects}</span>
                </td>
                <td style={{ padding: '8px 12px' }}>
                  <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 10, color: cu.status ? c.green : c.textSub }}>
                    <span style={{ width: 5, height: 5, borderRadius: '50%', background: cu.status ? c.green : c.textDim }}></span>
                    {cu.status ? 'Aktiv' : 'Inaktiv'}
                  </span>
                </td>
                <td style={{ padding: '8px 12px' }}>
                  <div style={{ display: 'flex', gap: 4 }}>
                    {['⊙', '✎', '⌫'].map((ic, ii) => (
                      <button key={ii} style={{ width: 22, height: 22, border: `1px solid ${c.border}`, borderRadius: 4, background: 'transparent', cursor: 'pointer', fontSize: 10, color: ii === 2 ? c.danger : c.textSub, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{ic}</button>
                    ))}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Pagination */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span style={{ fontSize: 11, color: c.textDim }}>Zeige 1–{filtered.length} von {filtered.length}</span>
        <div style={{ display: 'flex', gap: 4 }}>
          {['«', '‹', '1', '›', '»'].map((b, i) => (
            <button key={i} style={{ width: 26, height: 26, border: `1px solid ${c.border}`, borderRadius: 4, background: b === '1' ? c.primary : 'transparent', color: b === '1' ? '#fff' : c.textSub, fontSize: 11, cursor: 'pointer', fontFamily: 'inherit' }}>{b}</button>
          ))}
        </div>
      </div>
    </div>
  );
}

function D3Projects({ c }) {
  return (
    <div style={{ padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
      <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, background: c.card, border: `1px solid ${c.border}`, borderRadius: 6, padding: '5px 10px', flex: 1 }}>
          <span style={{ color: c.textSub, fontSize: 12 }}>⌕</span>
          <input placeholder="Projektnr., Name, Kunde..." style={{ border: 'none', outline: 'none', flex: 1, background: 'transparent', color: c.text, fontSize: 12, fontFamily: 'inherit' }} />
        </div>
        <select style={{ padding: '5px 10px', background: c.card, border: `1px solid ${c.border}`, borderRadius: 6, fontSize: 11, color: c.textSub, fontFamily: 'inherit', outline: 'none' }}>
          <option>Alle Status</option><option>In Arbeit</option><option>Pausiert</option><option>Abgeschlossen</option>
        </select>
        <span style={{ fontSize: 11, color: c.textDim }}>{PROJECTS.length} Projekte</span>
      </div>

      <div style={{ background: c.card, border: `1px solid ${c.border}`, borderRadius: 8, overflow: 'hidden' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
          <thead>
            <tr style={{ background: c.surface, borderBottom: `1px solid ${c.border}` }}>
              {['Proj.-Nr.', 'Name', 'Kunde', 'Status', 'Start', 'Ende', 'Budget', 'Genutzt', 'Verr.', ''].map(h => (
                <th key={h} style={{ padding: '8px 12px', textAlign: 'left', fontSize: 10, fontWeight: 600, color: c.textDim, letterSpacing: '0.6px', textTransform: 'uppercase', whiteSpace: 'nowrap' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {PROJECTS.map((pr, i) => (
              <tr key={pr.id} style={{ borderBottom: `1px solid ${c.border}30`, background: i % 2 === 0 ? 'transparent' : c.surface + '40' }}>
                <td style={{ padding: '9px 12px', fontFamily: "'DM Mono', monospace", fontSize: 10, color: c.textSub }}>{pr.no}</td>
                <td style={{ padding: '9px 12px', fontWeight: 600, color: c.text, maxWidth: 160, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{pr.name}</td>
                <td style={{ padding: '9px 12px' }}>
                  <div style={{ color: c.text, fontSize: 11 }}>{pr.customer}</div>
                  <div style={{ fontSize: 9, color: c.textSub, fontFamily: "'DM Mono', monospace" }}>{pr.customerNo}</div>
                </td>
                <td style={{ padding: '9px 12px' }}><D3StatusBadge s={pr.status} c={c} /></td>
                <td style={{ padding: '9px 12px', color: c.textSub, fontSize: 10, fontFamily: "'DM Mono', monospace" }}>{pr.start}</td>
                <td style={{ padding: '9px 12px', color: c.textSub, fontSize: 10, fontFamily: "'DM Mono', monospace" }}>{pr.end}</td>
                <td style={{ padding: '9px 12px', fontFamily: "'DM Mono', monospace", fontSize: 11, color: c.text }}>€{pr.budget.toLocaleString('de')}</td>
                <td style={{ padding: '9px 12px', minWidth: 90 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <div style={{ flex: 1, background: c.surface, borderRadius: 3, height: 3, overflow: 'hidden', minWidth: 40 }}>
                      <div style={{ height: '100%', width: `${pr.used}%`, background: pr.used > 90 ? c.danger : c.primary, borderRadius: 3 }} />
                    </div>
                    <span style={{ fontSize: 9, color: c.textSub, fontFamily: "'DM Mono', monospace", flexShrink: 0 }}>{pr.used}%</span>
                  </div>
                </td>
                <td style={{ padding: '9px 12px' }}>
                  <span style={{ color: pr.invoiced ? c.green : c.textDim, fontSize: 13 }}>{pr.invoiced ? '✓' : '○'}</span>
                </td>
                <td style={{ padding: '9px 12px' }}>
                  <div style={{ display: 'flex', gap: 4 }}>
                    {['⊙', '✎', '⌫'].map((ic, ii) => (
                      <button key={ii} style={{ width: 22, height: 22, border: `1px solid ${c.border}`, borderRadius: 4, background: 'transparent', cursor: 'pointer', fontSize: 10, color: ii === 2 ? c.danger : c.textSub, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{ic}</button>
                    ))}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ─── Main Shell ──────────────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "activeDesign": "2",
  "accentColor": "#3b5bdb"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [pages, setPages] = React.useState({ '1': 'dashboard', '2': 'dashboard', '3': 'dashboard' });
  const d = tweaks.activeDesign;

  const designs = [
    { id: '1', label: 'Strukturiert', dot: '#1a3fa8', desc: 'Klassisch · Sidebar · Tabellen' },
    { id: '2', label: 'Modern', dot: '#3b5bdb', desc: 'Cards · Split-Pane · Kontextpanel' },
    { id: '3', label: 'Kompakt', dot: '#4d8ef8', desc: 'Dark · Top-Nav · Maximale Dichte' },
  ];

  const setPage = (page) => setPages(prev => ({ ...prev, [d]: page }));

  return (
    <div style={{ width: '100vw', height: '100vh', display: 'flex', flexDirection: 'column', background: '#0a0d14', overflow: 'hidden' }}>
      {/* Tab bar */}
      <div className="tab-bar">
        <div className="tab-bar-logo">Fino<span>vo</span></div>
        {designs.map(des => (
          <button key={des.id} className={`tab-btn ${d === des.id ? 'active' : ''}`} onClick={() => setTweak('activeDesign', des.id)}>
            <span className="tab-dot" style={{ background: des.dot }} />
            <span>{des.id}. {des.label}</span>
            <span style={{ fontSize: 10, opacity: 0.6, fontWeight: 400 }}>— {des.desc}</span>
          </button>
        ))}
      </div>

      {/* Frame */}
      <div className="canvas-wrap">
        <div className="app-frame" style={{ width: 1280, height: 760 }}>
          {d === '1' && <Design1 page={pages['1']} setPage={setPage} />}
          {d === '2' && <Design2 page={pages['2']} setPage={setPage} />}
          {d === '3' && <Design3 page={pages['3']} setPage={setPage} />}
        </div>
      </div>

      <TweaksPanel>
        <TweakSection title="Design Auswahl">
          <TweakRadio id="activeDesign" label="Aktives Design" options={['1','2','3']} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
